# Working papers. Same fields as publications.yml (year optional).
# `stage` groups the list: keep all "Under review" papers first, then "Work in progress".
# `themes`: any of coordination, learning, ai, blockchain (drives the filter on the Research page).
# `summary`: one plain-language sentence. Do not name the journal for papers under review.

- title: "A model of group decision-making and centralization"
  authors: "Klapper, H., Maciejovsky, B., & Reitzig, M."
  stage: "Under review"
  themes: [coordination]
  summary: "A formal model of when centralized versus decentralized structures aggregate dispersed information better."
  note: "Earlier version: Academy of Management Proceedings, 2019"
  links:
    - label: AOM Proceedings
      url: "https://doi.org/10.5465/AMBPP.2019.11990"

- title: "Learning without converging: The role of decomposability"
  authors: "Ubert, E., Klapper, H., & Haans, R."
  stage: "Under review"
  themes: [learning]
  summary: "A study of decentralized search in speedrunning communities and how task decomposability relates to convergence on solutions."
  note: "Earlier version in the Academy of Management Best Paper Proceedings, 2025, as “The dual effect of multi-actor search”"
  links:
    - label: AOM Proceedings
      url: "https://doi.org/10.5465/AMPROC.2025.4bp"

- title: "Corporate blockchains and imprinting"
  authors: "Goldsby, C., Hanisch, M., & Klapper, H."
  stage: "Work in progress"
  themes: [blockchain]
  summary: "A study of how initial governance choices may constrain later adaptation in blockchain consortia."
  note: "Distinguished Paper Award, Strategic Management Division, Academy of Management 2023 · Best Paper nominee, Strategic Management Society 2023"
  links:
    - label: AOM Proceedings
      url: "https://doi.org/10.5465/AMPROC.2023.211bp"

- title: "Human coordination shapes the promise and limits of autonomous agents"
  authors: "Zhang, J., Luo, K., Clement, J., & Klapper, H."
  stage: "Work in progress"
  themes: [ai]
  summary: "An examination of how human coordination structures shape the performance of autonomous AI agents."

- title: "Organizational decision-making and AI"
  authors: "Wan, C., Klapper, H., & Li, T."
  stage: "Work in progress"
  themes: [ai]
  summary: "A formal model of how organizations aggregate human and algorithmic evaluations under sequential versus simultaneous decision structures."

- title: "Delegation and decentralized organizations"
  authors: "Klapper, H., Hsieh, Y.-Y., & Janjic, R."
